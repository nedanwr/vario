# Verifies pull requests into master and every push to master (including merges).
# Runs tests and vet, then cross-compiles and packages every release target.
# Cross-compilation proves the code builds for each platform; it does not run
# the binaries there.
name: Build

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs; let every push to master finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # module and build cache keyed on go.sum

      - name: Verify modules
        run: go mod verify

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo "::error::Files are not gofmt-formatted; run 'make fmt'."
            exit 1
          fi

      - name: Vet
        run: |
          # Type-check platform-specific code (including tests) for every target OS.
          for goos in linux darwin windows; do
            echo "go vet (GOOS=$goos)"
            GOOS=$goos go vet ./...
          done

      - name: Test
        run: make test

      - name: Test installers
        run: scripts/release/test-installers.sh

      - name: Build release archives (all targets)
        run: make dist VERSION="ci-${GITHUB_SHA::12}"

      - name: Check archives
        working-directory: dist
        run: |
          sha256sum --check --strict checksums.txt
          tar -xzf "vario_ci-${GITHUB_SHA::12}_linux_amd64.tar.gz"
          "./vario_ci-${GITHUB_SHA::12}_linux_amd64/vario" version
